name: Mobile QA and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android analysis, tests, APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform hosts
        run: bash tool/bootstrap_platforms.sh
      - name: Verify Android privacy safeguards
        run: python3 tool/check_android_privacy.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Prepare Android NDK with download verification and retries
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "NDK already installed"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Installing Android NDK: attempt $attempt"
            rm -rf "$NDK_DIR"
            if printf 'y\n' | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" &&
                [ -f "$NDK_DIR/source.properties" ]; then
              echo "Android NDK verified"
              exit 0
            fi
            sleep $((attempt * 8))
          done
          echo "NDK download failed after three retries" >&2
          exit 1
      - name: Build Android installable alpha
        run: flutter build apk --release
      - name: Build Android application bundle
        run: flutter build appbundle --release
      - name: Verify and name Android packages
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SELQUARO-v0.4.0-android-test.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/SELQUARO-v0.4.0-android-test.aab
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: selquaro-android-v0.4.0
          path: dist/
          if-no-files-found: error

  ios:
    name: iOS compilation
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform hosts
        run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Verify compiled app exists
        run: test -d build/ios/iphoneos/Runner.app

  release:
    name: Publish v0.4.0 after both platforms pass
    needs: [android, ios]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: selquaro-android-v0.4.0
          path: dist
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo 'v0.4.0 already exists; no duplicate release.'
            exit 0
          fi
          gh release create v0.4.0 dist/SELQUARO-v0.4.0-android-test.apk dist/SELQUARO-v0.4.0-android-test.aab dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "SELQUARO 0.4.0" \
            --prerelease \
            --notes-file RELEASE_NOTES.md
