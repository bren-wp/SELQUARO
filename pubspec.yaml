name: selquaro
description: Private, offline receipt and warranty vault for Android and iOS.
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^10.3.3
  google_mlkit_text_recognition: ^0.15.0
  intl: ^0.20.2
  uuid: ^4.5.1
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  flutter_local_notifications: 19.5.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1
  pdfrx: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
